services:
  discord-bot:
    container_name: discord-bot
    image: dardenne8u/tt2-seed-parser-discord-bot
    build:
      context: ./discord-bot
      platforms:
        - linux/amd64
      dockerfile: Dockerfile
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      TARGET_CHANNEL_ID: ${TARGET_CHANNEL_ID}
      DATA_DIR: /data/seeds
      PYTHONUNBUFFERED: 1
    volumes:
      - seed-data:/data
    restart: unless-stopped

  api:
    container_name: api
    image: dardenne8u/tt2-seed-parser-api
    build:
      context: ./api
      platforms:
        - linux/amd64
      dockerfile: Dockerfile
    ports:
      - 5001:8080
    environment:
      ADMIN_KEY: ${ADMIN_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - seed-data:/data
      - api-tokens:/tokens
    restart: unless-stopped

volumes:
  seed-data:
  api-tokens:
